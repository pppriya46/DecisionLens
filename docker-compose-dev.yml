services:
  postgres:
    image: ankane/pgvector:latest
    container_name: decisionlens_postgres_dev
    environment:
      POSTGRES_DB: decisionlens_db
      POSTGRES_USER: decisionlens
      POSTGRES_PASSWORD: decisionlens123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U decisionlens -d decisionlens_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: decisionlens_api_dev
    environment:
      - PORT=5000
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=decisionlens_db
      - DB_USER=decisionlens
      - DB_PASSWORD=decisionlens123
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - SEVERITY_MODEL_PATH=ml/models/severity_rf_v1.pkl
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  postgres_data_dev: